<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Initialize Sections - WCT Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }
    p {
      color: #666;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #result {
      margin-top: 20px;
      padding: 20px;
      border-radius: 10px;
      display: none;
    }
    #result.success {
      background: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
    }
    #result.error {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      color: #721c24;
    }
    .result-item {
      margin: 5px 0;
      font-size: 14px;
    }
    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Initialize Sections</h1>
    <p>This will create default data for all 4 sections in your database:</p>
    <ul style="margin-bottom: 20px; padding-left: 20px; color: #666;">
      <li>CCTV Surveillance Section</li>
      <li>Low Current Solutions Section</li>
      <li>Structured Cabling Section</li>
      <li>Clients Section</li>
    </ul>
    <p style="font-size: 14px; color: #999;">Note: This won't overwrite existing data.</p>
    
    <button id="initBtn" onclick="initializeSections()">Initialize All Sections</button>
    
    <div id="result"></div>
  </div>

  <script>
    async function initializeSections() {
      const btn = document.getElementById('initBtn');
      const resultDiv = document.getElementById('result');
      
      btn.disabled = true;
      btn.innerHTML = '<span class="loader"></span> Initializing...';
      resultDiv.style.display = 'none';
      
      try {
        const response = await fetch('/api/init-sections', {
          method: 'POST',
          credentials: 'include'
        });
        
        const data = await response.json();
        
        if (data.success) {
          resultDiv.className = 'success';
          resultDiv.style.display = 'block';
          resultDiv.innerHTML = `
            <strong>✓ ${data.message}</strong>
            ${data.results.map(r => `<div class="result-item">${r}</div>`).join('')}
          `;
        } else {
          throw new Error(data.error || 'Failed to initialize');
        }
      } catch (error) {
        resultDiv.className = 'error';
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = `<strong>✗ Error:</strong> ${error.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Initialize All Sections';
      }
    }
  </script>
</body>
</html>
